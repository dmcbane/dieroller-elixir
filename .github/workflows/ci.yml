name: CI

on:
  push:
  pull_request:

env:
  # Kept in step with .tool-versions.
  OTP_VERSION: "28.3"
  ELIXIR_VERSION: "1.19.4"
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # --include slow runs the 12^6 brute force that proves the compile-time
      # purchase table still matches the Racket original's algorithm.
      - name: Run tests
        run: mix test --include slow

      - name: Generate the ability score table
        run: |
          mix ability_scores --out ./csv --legal-only
          test "$(wc -l < csv/legal_scores.csv)" -eq 12377

  release:
    name: Standalone binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Burrito cross-compiles its launcher with Zig, and requires this exact
      # version.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: mix deps.get

      - name: Build releases
        run: |
          MIX_ENV=prod mix release dieroller --overwrite
          MIX_ENV=prod mix release pathfinder_character --overwrite

      - name: Smoke test the binaries
        run: |
          ./burrito_out/dieroller_linux --version
          ./burrito_out/dieroller_linux 4d6k3 -v
          ./burrito_out/dieroller_linux 6x4d6k3 -v
          ./burrito_out/dieroller_linux 2d6+1d8-1 -v
          ./burrito_out/dieroller_linux 2d20kl1 -v
          ./burrito_out/dieroller_linux "sum(6x4d6k3)" -v
          ./burrito_out/dieroller_linux avg:100x1d20
          ./burrito_out/pathfinder_character_linux --version
          ./burrito_out/pathfinder_character_linux -p epic -n 2 -v
          # A validation failure must exit non-zero.
          if ./burrito_out/dieroller_linux 2d6k5; then exit 1; fi
          # The removed flags must be rejected.
          if ./burrito_out/dieroller_linux --dice 3; then exit 1; fi
          # An unknown aggregate must be rejected.
          if ./burrito_out/dieroller_linux worst:6x4d6k3; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: burrito_out/

  # Publishes on a tag only. It attaches the artifact the job above built and
  # smoke tested rather than rebuilding, so what ships is byte for byte what
  # passed CI, and `contents: write` stays scoped to a job that ordinary pushes
  # never reach.
  publish:
    name: Attach binaries to the release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The full history brings the annotated tag with it, whose message
      # becomes the release notes when the release does not exist yet.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist

      - name: Attach the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mv dist/dieroller_linux "dist/dieroller-$version-linux-x86_64"
          mv dist/pathfinder_character_linux "dist/pathfinder-character-$version-linux-x86_64"
          (cd dist && sha256sum ./*-linux-x86_64 | sed 's# \./# #' > SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
          # --clobber so re-running the workflow replaces the assets rather
          # than failing on the ones already there.
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
